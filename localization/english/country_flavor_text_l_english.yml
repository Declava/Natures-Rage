# New Flavour Text
 DTJ_FLAVOR_TEXT:0 "It has been over two centuries since the union of Darthyria and Jallentia. Ever since, Darthyria-Jallentia has been on the continual path to economic prosperity and colonial dominance, however a storm awaits in the coming decade as a great conflict involving the nations of Larythia looms, threatening Darthyrian growth and even it's existence. Will the sun set on the Great Kingdom and become just another forgotten empire, or will Darthyria-Jallentia weather the storm and usher in the Matthieuan Era?"

 YAS_FLAVOR_TEXT:0 "Previously a powerful monarchy in western Larythia, the tides of republicanism and revolution have managed to sweep Yasarnia, which it used to it's advantage to become the world's dominant naval power. It controls extremely rich colonies such as the Terarinaja and the Dorothynan Archipelago, and has the world's most robust industry, where factories reign supreme in the landscape from the Seine to the Tarsinian border. Though it is an extremely powerful nation, and on paper the world's strongest, cracks have started to show in the heavily flawed nation's government and economy. Extremely poor factory conditions, significant internal parliamentary and aristocratic decadence as well as the squalid treatment of minorities in the colonies have turned into significant issues in Yasarnian society. The Elatyari government has thus taken to antagonizing the Empire of Vanhaus in Eastern Larythia in order to distract the population from these problems, but this solution will only work for so long. Will Yasarnia fall to decadence, plagued by aristocratic rule and eclipsed by it's neighbors in Valuria, Tarsina and Darthyria-Jallentia? Or will Yasarnia be able to rebound and show the world why it is the dominant superpower?"

 TAR_FLAVOR_TEXT:0 "The Republic of Tarsina has been on a downward spiral under an oligarchic rule and political & cultural conflict before the Triumvirate's members were even born. Engulfed in a near-constant strife for power between selfish oligarchs and corrupt political leaders, Tarsina is in a period of complete degeneration and stagnation, and had lost the incredible power and influence it once held only two generations ago. Overshadowed by Darthyria-Jallentia, Valuria, Vanhäus and even their republican apprentices in Yasarnia, and in constant threat of collapsing once more, will Tarsina manage to surmount these difficulties and re-emerge as the influential and powerful Republic it once was? Or will Tarsina continue declining into decadence and fracturing into multiple mere pawns to the great powers of Larythia?"

 VAL_FLAVOR_TEXT:0 "In the past few centuries, Valuria had been constantly growing from it's humble beginnings in the central region of Italy into a respected great power in Larythia, conquering large swathes of land in both it's homeland and Africa. Considered the underdog of Larythian affairs for most of Valuria's existence, will Valuria become a pawn of the other major powers such as Yasarnia, Darthyria-Jallentia, and Tarsina, or will the rising underdog defeat Yasarnia and claim hegemony over Larythia and the world at large?"

 MAI_FLAVOR_TEXT:0 "Long ago, Mairytha was not the weak power that it is today, previously spanning from Lisbon to Sicily and having owned a vast colonial empire stretching from the Andes Mountains to Aereshina. If it weren't for the bastards in Meratte and Athénaura, Mairytha would have been the superpower of the world for millenia. Today, the Empire is not yet lost, and in the fast approaching Iberian conflict, there is a chance for a glorious restoration. Will Mairytha collapse at the hands of Elanstar, or will Mairytha take its rightful place as world superpower, and restore the Greater Mairythan Empire?"

 ELA_FLAVOR_TEXT:0 "From it's inception, Elanstar has been steadily growing from the ashes of the Greater Mairythan Empire, claiming the southern half of Iberia for itself, and later on managing to forge key alliances with the kingdoms of Amarystia, Valuria, and Darthyria-Jallentia which it would use to it's benefit in the great game they call Iberia. Today, a powder keg of great tension has formed between the Iberian nations, and it is only a matter of time before war breaks out. Will Elanstar see it's total destruction under an ambitious Mairytha, or will it unify the divided peninsula and achieve it's destiny as Great Power?"

